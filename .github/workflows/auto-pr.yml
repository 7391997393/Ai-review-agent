name: Create Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_PR" -gt 0 ]; then
            echo "Open pull request already exists for ${GITHUB_REF_NAME}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "AI Code Review Demo" \
              --body "Automatically created pull request for AI Code Review."
          fi